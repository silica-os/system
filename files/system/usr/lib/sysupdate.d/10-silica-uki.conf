[Transfer]
ProtectVersion=%A
# SHA256SUMS must carry a valid signature (SHA256SUMS.gpg) by the key in
# /usr/lib/systemd/import-pubring.pgp.
Verify=yes

[Source]
Type=url-file
Path=@UPDATE_URL@
MatchPattern=silica_@v.efi.xz

[Target]
Type=regular-file
Path=/EFI/Linux
PathRelativeTo=esp
MatchPattern=silica_@v.efi
Mode=0444
InstancesMax=2
