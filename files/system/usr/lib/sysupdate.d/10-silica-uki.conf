[Transfer]
ProtectVersion=%A
# Images are not GPG-signed yet: the usr image carries its own dm-verity
# signature, checked by the kernel.
Verify=false

[Source]
Type=url-file
Path=@UPDATE_URL@
MatchPattern=silica_@v.efi.xz

[Target]
Type=regular-file
Path=/EFI/Linux
PathRelativeTo=esp
MatchPattern=silica_@v.efi
Mode=0444
InstancesMax=2
