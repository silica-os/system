[Transfer]
ProtectVersion=%A
# SHA256SUMS must carry a valid signature (SHA256SUMS.gpg) by the key in
# /usr/lib/systemd/import-pubring.pgp.
Verify=yes

[Source]
Type=url-file
Path=@UPDATE_URL@
MatchPattern=silica_@v.usr.verity-sig.xz

[Target]
Type=partition
Path=auto
MatchPattern=silica_usr_verity_sig_@v
MatchPartitionType=usr-verity-sig
ReadOnly=true
InstancesMax=2
