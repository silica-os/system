[Transfer]
ProtectVersion=%A
# Images are not GPG-signed yet: the usr image carries its own dm-verity
# signature, checked by the kernel.
Verify=false

[Source]
Type=url-file
Path=@UPDATE_URL@
MatchPattern=silica_@v.usr.verity-sig.xz

[Target]
Type=partition
Path=auto
MatchPattern=silica_usr_verity_sig_@v
MatchPartitionType=usr-verity-sig
ReadOnly=true
InstancesMax=2
