[Transfer]
ProtectVersion=%A
# Images are not GPG-signed yet: the usr image carries its own dm-verity
# signature, checked by the kernel.
Verify=false

[Source]
Type=url-file
Path=@UPDATE_URL@
MatchPattern=silica_@v_@u.usr.erofs.xz

[Target]
Type=partition
Path=auto
MatchPattern=silica_usr_@v
MatchPartitionType=usr
ReadOnly=true
InstancesMax=2
