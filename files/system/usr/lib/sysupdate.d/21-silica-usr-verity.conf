[Transfer]
ProtectVersion=%A
# SHA256SUMS must carry a valid signature (SHA256SUMS.gpg) by the key in
# /usr/lib/systemd/import-pubring.pgp.
Verify=yes

[Source]
Type=url-file
Path=@UPDATE_URL@
MatchPattern=silica_@v_@u.usr.verity.xz

[Target]
Type=partition
Path=auto
MatchPattern=silica_usr_verity_@v
MatchPartitionType=usr-verity
ReadOnly=true
InstancesMax=2
