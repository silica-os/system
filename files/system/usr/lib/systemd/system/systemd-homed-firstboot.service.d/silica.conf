[Service]
# New users get zsh. homectl would otherwise use systemd's built-in default
# (bash) because --prompt-shell=no. Keep the other options of the stock unit.
ExecStart=
ExecStart=homectl firstboot --prompt-new-user --prompt-shell=no --prompt-groups=no --mute-console=yes --shell=/usr/bin/zsh --member-of=wheel
