# Silica's visible layout (docs/base-system.md). /System is a view into the
# sealed /usr image; the rest lives on the encrypted data partition.
L /System - - - - usr/System
d /Applications 0755 root root -
d /Library 0755 root root -
d /Library/Preferences 0755 root root -
d "/Library/Application Support" 0755 root root -
d /Library/Caches 0755 root root -
d /Library/Logs 0755 root root -
d /Library/Keychains 0700 root root -
d /Users 0755 root root -
