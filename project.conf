# Silica base system: BuildStream project on freedesktop-sdk.
name: silica

min-version: 2.5

element-path: elements

(@):
- freedesktop-sdk.bst:include/runtime.yml

fatal-warnings:
- overlaps

aliases:
  gitlab: https://gitlab.com/
  github: https://github.com/
  kernel: https://git.kernel.org/pub/scm/
  freedesktop: https://gitlab.freedesktop.org/
  sourceforge: https://downloads.sourceforge.net/
  zsh: https://www.zsh.org/pub/
  brltty: https://brltty.app/archive/
  openvpn: https://swupdate.openvpn.net/community/releases/

plugins:
- origin: pip
  package-name: buildstream-plugins
  sources:
  - git

- origin: junction
  junction: freedesktop-sdk.bst:plugins/buildstream-plugins.bst
  elements:
  - make
  - meson
  - cmake
  - autotools

- origin: junction
  junction: freedesktop-sdk.bst:plugins/buildstream-plugins-community.bst
  elements:
  - cargo
  sources:
  - cargo2
  - git_repo
  - patch_queue

- origin: junction
  junction: freedesktop-sdk.bst
  elements:
  - collect_initial_scripts

options:
  target_arch:
    type: arch
    description: Architecture
    variable: target_arch
    values:
    - x86_64

variables:
  build-root: '/buildstream-build'
  silica-version: '0.1.0'
  source-date-epoch: '1761091200'

environment:
  SOURCE_DATE_EPOCH: '%{source-date-epoch}'

sources:
  git_repo:
    config:
      ref-format: git-describe

sandbox:
  build-arch: '%{arch}'

# Artifacts of unchanged freedesktop-sdk elements come from its cache;
# everything Silica changes is built here.
artifacts:
- url: https://cache.freedesktop-sdk.io:11001

source-caches:
- url: https://cache.freedesktop-sdk.io:11001
